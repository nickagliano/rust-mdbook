# Manually triggered. Rebuilds and retests everything from master, then
# publishes to the chosen index with trusted publishing (OIDC); there are no
# API tokens. Each index needs a trusted publisher on its side configured for
# this repo, this workflow file (release.yml), and the matching environment.
name: Release

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish-testpypi:
    name: Publish to TestPyPI
    if: inputs.index == 'testpypi'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rust-mdbook/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: inputs.index == 'pypi'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/rust-mdbook/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

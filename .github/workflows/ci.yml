name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Lets update-upstream.yml start CI on its bump branches: pushes made with
  # GITHUB_TOKEN don't trigger `pull_request` runs, but dispatches do.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

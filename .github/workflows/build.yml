# Reusable workflow: verify the upstream pin, build every wheel plus the sdist,
# and smoke-test each one in a fresh venv on a matching platform. Called by
# ci.yml and release.yml. Uploads artifacts named `dist-*`.
name: Build

on:
  workflow_call:

permissions: {}

env:
  # Pinned so release builds are reproducible; bump deliberately.
  RUST_TOOLCHAIN: "1.98.1"
  MATURIN_VERSION: "v1.15.0"
  PYTHON_VERSION: "3.13"

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify upstream pin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/verify_upstream.py

  wheel:
    name: Build wheel (${{ matrix.platform.name }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { name: macos-x86_64, runner: macos-15, target: x86_64-apple-darwin }
          - { name: windows-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: manylinux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2014" }
          - { name: manylinux-aarch64, runner: ubuntu-24.04, target: aarch64-unknown-linux-gnu, manylinux: "2014" }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          # `locked = true` in pyproject.toml makes this use upstream's Cargo.lock as-is.
          args: --release --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  test-wheel:
    name: Test wheel (${{ matrix.platform.name }})
    needs: wheel
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each wheel is installed on a clean runner of its own platform, with no Rust toolchain involved.
        platform:
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-x86_64, runner: windows-2025 }
          - { name: manylinux-x86_64, runner: ubuntu-24.04 }
          - { name: manylinux-aarch64, runner: ubuntu-24.04-arm }
          - { name: musllinux-x86_64, runner: ubuntu-24.04, alpine: true }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, alpine: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-wheel-${{ matrix.platform.name }}
          path: dist
      - if: ${{ !matrix.platform.alpine }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - if: ${{ !matrix.platform.alpine }}
        run: python scripts/check_dist.py dist/*.whl
      # JavaScript actions can't run inside Alpine on arm64, so use plain `docker run`.
      - if: ${{ matrix.platform.alpine }}
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "python:${PYTHON_VERSION}-alpine"
          python scripts/check_dist.py dist/*.whl

  sdist:
    name: Build sdist
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-sdist:
    name: Test sdist (build from source)
    needs: sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # No submodule: the sdist alone must be enough to build mdbook.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sdist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - run: python scripts/check_dist.py dist/*.tar.gz
